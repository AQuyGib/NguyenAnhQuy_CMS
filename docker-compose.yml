services:
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin_service
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: host.docker.internal
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    extra_hosts:
      - "host.docker.internal:host-gateway"
